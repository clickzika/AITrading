strategy: ema_macd_xauusd
symbol: XAUUSD
timeframe: H1
description: "EMA cross + MACD confirmation on XAUUSD H1"

entry:
  conditions:
    - type: ema_cross
      fast: 20
      slow: 50
      direction: bullish
    - type: macd_signal
      signal: bullish
    - type: fib_zone
      levels: [38.2, 61.8]
      zone: support
  logic: AND

exit:
  conditions:
    - type: ema_cross
      fast: 20
      slow: 50
      direction: bearish
  logic: OR

risk:
  method: fixed_fractional
  risk_pct: 1.0
  stop_loss_pips: 30
  take_profit_pips: 90
  trailing_stop: true
  trailing_stop_pips: 20
  max_daily_loss_usd: 200
  max_open_positions: 3
  max_lot_size: 1.0
