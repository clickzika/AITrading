name: CI

on:
  push:
    branches: [develop, main, uat]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      MT5_MOCK: "true"
      JWT_SECRET_KEY: "ci-test-secret-not-for-production"
      TRADER_PASSWORD: "ci-test-password"
      DATABASE_URL: "postgresql+asyncpg://aitrading:aitrading@localhost:5432/aitrading"
      REDIS_URL: "redis://:cipassword@localhost:6379/0"
      POSTGRES_PASSWORD: "aitrading"
      REDIS_PASSWORD: "cipassword"

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: aitrading
          POSTGRES_USER: aitrading
          POSTGRES_PASSWORD: aitrading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aitrading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ tests/ main.py

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app/ main.py --ignore-missing-imports

      - name: Run tests
        working-directory: backend
        run: pytest --tb=short

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run build
